  <div class="modal" id="swatchModal" hidden>
    <div class="modal-backdrop" data-modal-close></div>
    <div class="modal-dialog modal-dialog--md" role="dialog" aria-modal="true" aria-labelledby="sw-title" tabindex="-1">
      <div class="modal-head">
        <div><p class="eyebrow">Free · Up to 4 · 2–3 days</p><h2 class="modal-title" id="sw-title">Feel the materials at home</h2></div>
        <button class="modal-x" type="button" data-modal-close aria-label="Close"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      </div>
      <form class="form-stack" id="swatchForm" data-validate novalidate data-swatch-form>
        <fieldset class="field"><legend class="sr-only">Pick up to 4 swatches</legend>
          <div class="swatch-pick" data-swatch-pick>
            <label class="sw-card" style="--c:#14161B"><input type="checkbox" name="swatch" value="Jet black PU"><span class="sw-chip"></span><span>Jet black PU</span></label>
            <label class="sw-card" style="--c:#5B3A29"><input type="checkbox" name="swatch" value="Mocha PU"><span class="sw-chip"></span><span>Mocha PU</span></label>
            <label class="sw-card" style="--c:#D8C7A6"><input type="checkbox" name="swatch" value="Ivory PU"><span class="sw-chip"></span><span>Ivory PU</span></label>
            <label class="sw-card" style="--c:#6E1E24"><input type="checkbox" name="swatch" value="Oxblood PU"><span class="sw-chip"></span><span>Oxblood PU</span></label>
            <label class="sw-card" style="--c:#3A3F48"><input type="checkbox" name="swatch" value="Graphite perforated"><span class="sw-chip"></span><span>Graphite perforated</span></label>
            <label class="sw-card" style="--c:#8B5A33"><input type="checkbox" name="swatch" value="Tan perforated"><span class="sw-chip"></span><span>Tan perforated</span></label>
            <label class="sw-card" style="--c:#5D626B"><input type="checkbox" name="swatch" value="Grey microsuede"><span class="sw-chip"></span><span>Grey microsuede</span></label>
            <label class="sw-card" style="--c:#2A3A55"><input type="checkbox" name="swatch" value="Navy jacquard"><span class="sw-chip"></span><span>Navy jacquard</span></label>
          </div>
        </fieldset>
        <p class="sw-count" data-swatch-count aria-live="polite"><strong>0 of 4 selected</strong></p>
        <div class="form-grid">
          <div class="field"><label for="sw-name">Full name</label><input id="sw-name" name="name" type="text" autocomplete="name" placeholder="e.g. Priya Raman" required></div>
          <div class="field"><label for="sw-phone">Mobile</label><input id="sw-phone" name="phone" type="tel" inputmode="numeric" autocomplete="tel-national" placeholder="10-digit mobile number" required></div>
          <div class="field span-2"><label for="sw-address">Delivery address</label><input id="sw-address" name="address" type="text" autocomplete="street-address" placeholder="House no., street, area" required></div>
          <div class="field"><label for="sw-pin">PIN code</label><input id="sw-pin" name="pin" type="text" inputmode="numeric" autocomplete="postal-code" placeholder="6-digit PIN" required><p class="hint" data-pin-hint>Free delivery anywhere in Tamil Nadu and Kerala</p></div>
          <div class="field sw-submit"><button class="btn btn-primary btn-block btn-lg" type="submit">Send my swatches</button></div>
        </div>
      </form>
    </div>
  </div>
